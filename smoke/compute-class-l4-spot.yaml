apiVersion: cloud.google.com/v1
kind: ComputeClass
metadata:
  name: l4-spot
spec:
  priorities:
    - machineType: g2-standard-4
      gpu:
        type: nvidia-l4
        count: 1
      spot: true
    - machineType: n1-standard-4
      gpu:
        type: nvidia-tesla-t4
        count: 1
      spot: true
  nodePoolAutoCreation:
    enabled: true
  whenUnsatisfiable: DoNotScaleUp
